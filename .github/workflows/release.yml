name: Release

# Go modules release via semver git tags — there is no registry to publish
# to; the proxy serves whatever `vX.Y.Z` tags exist. This workflow validates
# the tagged commit builds and passes the unit + REST contract tests, then
# publishes a GitHub Release so the tag carries notes.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Validate + publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Copyright headers
        run: ./scripts/check_headers.sh

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.23"
          cache: true

      - name: Setup Node (for prism)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build
        run: go build ./...

      - name: Tests (runtime unit + REST contract)
        run: go test ./...

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
