name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Copyright headers
        run: ./scripts/check_headers.sh

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.23"
          cache: true

      - name: Setup Node (for prism + @archastro/channel-harness)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Audit JS tooling dependencies
        run: npm audit --audit-level=moderate

      - name: gofmt
        run: |
          unformatted="$(gofmt -l platform contracttests)"
          if [[ -n "$unformatted" ]]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            echo "Run ./scripts/regenerate_sdk.sh (or gofmt -w) and commit the result." >&2
            exit 1
          fi
        shell: bash

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Tests (runtime unit + REST + channel/stream contract)
        run: go test -race ./...
        env:
          ARCHASTRO_RUN_CHANNEL_CONTRACT_TESTS: "1"
